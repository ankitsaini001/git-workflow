name: Validate
on: push
jobs:
  Validate-html:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate HTML file exists
        run: test -f index.html

      # - name: Validate non-existing file
      #   run: test -f app.js

  Validate-js:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Javascript file exists
        run: test -f script.js

  Validate-codes:
    # run only after both jobs above pass (sequential instead of parallel)
    needs: [Validate-html, Validate-js]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate HTML code error
        run: npx --yes html-validate@9 index.html

      - name: Validate JS code error
        run: node --check script.js
