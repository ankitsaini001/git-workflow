name: Code Quality Check

# Trigger the workflow on pushes or pull requests to the main branch
on:
  push:
    branches: [ main, stage ]
  pull_request:
    branches: [ main, stage ]
jobs:
  Install-jobs:
      runs-on: ubuntu-latest

      steps:
        # Step 1: Clone the repository onto the GitHub runner machine
        - name: Checkout Source Code
          uses: actions/checkout@v4

        # Step 2: Set up Node.js environment
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 24
            cache: 'npm' # Speeds up execution by caching node_modules

        # Step 3: Install all project dependencies
        - name: Install Dependencies
          run: npm ci

        # Step 4: Execute the linting engine
        - name: Run ESLint Engine
          run: npm run lint

  Test-jobs:
      runs-on: ubuntu-latest

      steps:
        # Step 1: Clone the repository onto the GitHub runner machine
        - name: Checkout Source Code
          uses: actions/checkout@v4

        # Step 2: Set up Node.js environment
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 24
            cache: 'npm' # Speeds up execution by caching node_modules

        # Step 3: Install all project dependencies
        - name: Install Dependencies
          run: npm ci

        # Step 4: Execute the linting engine
        - name: Run ESLint Engine
          run: npm run lint

        # Step 5: Run test case for App.jsx file
        - name: Run Test Case for App.jsx file
          run: npm run test

        # Step 6: Artifacts manually download
        - name: Run the Artifacts Manually Download
          uses: actions/upload-artifact@v4
          with:
            name: react-build
            path: dist/
            retention-days: 7  

  Build-jobs:
      needs: [Install-jobs,Test-jobs]
      runs-on: ubuntu-latest

      env:
          VERCEL_ORG_TOKEN: "${{secrets.VERCEL_ORG_TOKEN}}"
          VERCEL_PROJECT_ID: "${{SECRETS.VERCEL_PROJECT_ID}}"

      steps:
        # Step 1: Clone the repository onto the GitHub runner machine
        - name: Checkout Source Code
          uses: actions/checkout@v4

        # Step 2: Set up Node.js environment
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 24
            cache: 'npm' # Speeds up execution by caching node_modules

        # Step 3: Install all project dependencies
        - name: Install Dependencies
          run: npm ci

        # Step 4: Execute the linting engine
        - name: Run ESLint Engine
          run: npm run lint

        # Step 5: Run test case for App.jsx file
        - name: Run Test Case for App.jsx file
          run: npm run test

        # Step 6: Artifacts manually download
        - name: Run the Artifacts Manually Download
          uses: actions/upload-artifact@v4
          with:
            name: react-build
            path: dist/
            retention-days: 7

        - name: "install vercel cli"
          run: npm install --global vercel

        - name: deployment on vercel
          run: vercel deploy dist --prod --yes --token="${{secrets.VERCEL_KEY}}" 
             


