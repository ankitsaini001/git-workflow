name: Validate
on: push
jobs:
  Validate-files:
    runs-on: ubuntu-latest
    steps:
      - name: Validate files
        uses: actions/checkout@v4

      - name: Validate HTML file exists
        run:  test -f index.html

      - name: Validate Javascript file exits
        run: test -f script.js
      
      # - name: Validate non-existing file
      #   run: test -f app.js      

      # to make these jobs works in sequentail rather then in parallel

  Validate-codes:
    needs: [Validate-files]
     runs-on: ubuntu-latest
     steps:
      - name: Validate HTML code error
        run: node --check index.html

      - name: Validate JS code error
        run: node --check script.js     